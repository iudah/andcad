# Termux / Android tuning. Keep the heap small so the daemon can start.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false

kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m

android.useAndroidX=true
android.enableJetifier=false
